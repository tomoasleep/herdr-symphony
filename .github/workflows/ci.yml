name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run check

  test:
    name: unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile

      - name: Run unit & integration tests
        run: bun test $(find src -name "*.test.ts" -not -name "*.e2e.test.ts" | sort)

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile

      - name: Build E2E Docker image
        run: docker build -f docker/e2e/Dockerfile -t herdr-e2e:latest .

      - name: Run E2E tests
        run: bun test src/e2e
